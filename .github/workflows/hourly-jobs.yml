# Hourly background jobs for OrbitOS.
# Vercel's free Hobby plan only allows daily crons, so these three run from GitHub Actions instead
# (free for this usage). On Vercel Pro you can move them back into vercel.json and delete this file.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   ORBITOS_URL  = https://your-live-domain (no trailing slash)
#   CRON_SECRET  = the same value as CRON_SECRET in Vercel
# Test it: Actions tab → "Hourly jobs" → Run workflow.
name: Hourly jobs

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 (GitHub may start it a few minutes late; the jobs allow for that)
  workflow_dispatch: {}

concurrency:
  group: hourly-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets are set
        env:
          ORBITOS_URL: ${{ secrets.ORBITOS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ORBITOS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add ORBITOS_URL and CRON_SECRET under Settings → Secrets and variables → Actions"; exit 1
          fi
      - name: Run jobs
        env:
          ORBITOS_URL: ${{ secrets.ORBITOS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          failed=0
          for job in digests checkin-reminders renewals payouts ai-briefs etims calendar; do
            code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" "$ORBITOS_URL/api/cron/$job" || echo 000)
            echo "$job -> HTTP $code: $(head -c 300 body.txt)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::$job failed with HTTP $code"; failed=1; fi
          done
          exit $failed
